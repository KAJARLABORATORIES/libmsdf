name: Continuous Integration

on:
  push:
    branches: [develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os.fullname }}
    timeout-minutes: 60
    env:
      OSU_EXECUTION_MODE: ${{ matrix.threadingMode }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - { prettyname: Windows, fullname: windows-latest, configuration: Debug }
          - { prettyname: macOS, fullname: macos-latest, configuration: Debug } # ARM: veja o item 3 abaixo
          - { prettyname: Linux, fullname: ubuntu-latest, configuration: Debug }
          - { prettyname: Linux, fullname: ubuntu-latest, configuration: Release }
        threadingMode: ["SingleThread", "MultiThreaded"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Compile
        run: dotnet build -c ${{ matrix.os.configuration }} osu-framework-msdf.slnx

      - name: Test
        run: >
          dotnet test osu-framework-msdf.slnx
          -c ${{ matrix.os.configuration }}
          --no-build
          --results-directory ${{ github.workspace }}/TestResults
          --logger "trx;LogFileName=TestResults-${{ matrix.os.prettyname }}-${{ matrix.threadingMode }}-${{ matrix.os.configuration }}.trx"
          -- NUnit.ConsoleOut=0

      # Sobe os resultados mesmo se o teste falhar.
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: libmsdf-test-results-${{ matrix.os.prettyname }}-${{ matrix.threadingMode }}-${{ matrix.os.configuration }}
          path: ${{ github.workspace }}/TestResults/TestResults-${{ matrix.os.prettyname }}-${{ matrix.threadingMode }}-${{ matrix.os.configuration }}.trx
          if-no-files-found: error
