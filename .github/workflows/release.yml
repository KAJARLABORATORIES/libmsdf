name: Package and NuGet

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  notify_process_deploy:
    name: Notify start
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      WEBHOOK_URL: ${{ secrets.DISCORD_INFRA_WEBHOOK_URL }}
    steps:
      - name: Notify Deployment
        run: |
          export TITLE="🚀 Deployment in Progress: libmsdf ($GITHUB_REF_NAME)"
          export URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          export DESCRIPTION="A new deployment for **libmsdf** has started."$'\n'"Stay tuned for updates!"$'\n'"➜ [View Workflow Run]($URL)"
          export ACTOR_ICON="https://avatars.githubusercontent.com/u/$GITHUB_ACTOR_ID"

          BODY="$(jq --null-input '{
            embeds: [{
              title: env.TITLE,
              color: 15098112,
              description: env.DESCRIPTION,
              url: env.URL,
              author: { name: env.GITHUB_ACTOR, icon_url: env.ACTOR_ICON }
            }]
          }')"

          curl --fail -H "Content-Type: application/json" -d "$BODY" "$WEBHOOK_URL"

  test:
    name: Test (${{ matrix.threadingMode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        threadingMode: ["SingleThread", "MultiThreaded"] # TODO: corte se não usar GameHost, igual ao ci.yml
    env:
      OSU_EXECUTION_MODE: ${{ matrix.threadingMode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # TODO: fixar por SHA
        with:
          persist-credentials: false

      - name: Install .NET
        uses: actions/setup-dotnet@v4 # TODO: fixar por SHA
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test SuaSolucao.sln -c Release # TODO: nome real da .sln

  pack:
    name: Pack (libmsdf)
    needs: [test]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      ARTIFACTS: ${{ github.workspace }}/artifacts
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # TODO: fixar por SHA
        with:
          persist-credentials: false

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Pack (libmsdf)
        run: dotnet pack lib -c Release /p:Version="${VERSION#v}" -o "$ARTIFACTS"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libmsdf
          path: ${{ github.workspace }}/artifacts/*.nupkg
          if-no-files-found: error

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish packages to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "$ARTIFACTS"/*.nupkg
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  notify_status_deploy:
    name: Notify result
    needs: [test, pack]
    if: always()
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      PACK_RESULT: ${{ needs.pack.result }}
      WEBHOOK_URL: ${{ secrets.DISCORD_INFRA_WEBHOOK_URL }}
    steps:
      - name: Notify Deployment Status
        run: |
          export TITLE="🚀 Deployment Completed: libmsdf ($GITHUB_REF_NAME)"
          export URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          if [ "$PACK_RESULT" = "success" ]; then
            STATUS="✅ Deployment successful!"; export COLOR=3066993
          else
            STATUS="❌ Deployment failed. Check logs for details."; export COLOR=15158332
          fi

          export DESCRIPTION="Deployment for **libmsdf** has finished."$'\n'"$STATUS"$'\n'"➜ [View Workflow Run]($URL)"
          export ACTOR_ICON="https://avatars.githubusercontent.com/u/$GITHUB_ACTOR_ID"

          BODY="$(jq --null-input '{
            embeds: [{
              title: env.TITLE,
              color: (env.COLOR | tonumber),
              description: env.DESCRIPTION,
              url: env.URL,
              author: { name: env.GITHUB_ACTOR, icon_url: env.ACTOR_ICON }
            }]
          }')"

          curl --fail -H "Content-Type: application/json" -d "$BODY" "$WEBHOOK_URL"
